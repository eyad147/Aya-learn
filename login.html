<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login.title">Log In - Aya Learn</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo"><i class="fas fa-book-quran"></i> <span data-i18n="app.name">Aya Learn</span></a>
        <h2 data-i18n="login.title">Welcome Back</h2>
        <p data-i18n="login.subtitle">Log in to your account</p>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="loginEmail" data-i18n="login.email">Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" data-i18n-placeholder="login.email_placeholder" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword" data-i18n="login.password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" data-i18n-placeholder="login.password_placeholder" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox"> <span data-i18n="login.remember">Remember me</span>
          </label>
          <a href="#" class="link-small" data-i18n="login.forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="login.submit">Log In</button>

        <div class="auth-divider"><span data-i18n="login.or">or</span></div>

        <button type="button" class="btn btn-google btn-block" onclick="window.location.href='/api/auth/google'">
          <i class="fab fa-google"></i> <span data-i18n="login.google">Continue with Google</span>
        </button>

        <p class="auth-footer"><span data-i18n="login.no_account">Don't have an account?</span> <a href="signup.html" data-i18n="login.signup_link">Sign Up</a></p>
      </form>
    </div>

    <div class="auth-visual">
      <div class="auth-visual-content">
        <i class="fas fa-book-quran"></i>
        <h3 data-i18n="app.name">Aya Learn</h3>
        <p data-i18n="app.tagline">Your journey in Quran memorization starts here</p>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Handle Google OAuth callback
    (function() {
      const params = new URLSearchParams(window.location.search);
      const googleAuth = params.get('google_auth');
      if (googleAuth) {
        try {
          const data = JSON.parse(atob(googleAuth));
          if (data.token && data.user) {
            saveAuth(data.user, data.token);
            redirectBasedOnRole(data.user.role);
          }
        } catch(e) {
          console.error('Google auth error:', e);
        }
      }
      const err = params.get('error');
      if (err === 'google_auth_failed') {
        alert(t('auth.google_failed'));
      }
    })();
  </script>
</body>
</html>
