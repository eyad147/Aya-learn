<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="sessions.title">My Sessions - Aya Learn</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="dashboard-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="logo"><i class="fas fa-book-quran"></i> <span data-i18n="app.name">Aya Learn</span></a>
      <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Populated by JS based on role -->
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">U</div>
        <div class="user-details">
          <span class="user-name"></span>
          <span class="user-role"></span>
        </div>
      </div>
      <a href="#" class="nav-item logout" data-i18n="nav.logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      <h1 data-i18n="sessions.title">My Sessions</h1>
      <div class="topbar-actions">
    <div class="notif-wrapper">
      <button class="notif-btn" id="notifBtn"><i class="fas fa-bell"></i><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
      <div class="notif-dropdown" id="notifDropdown"></div>
    </div>
    <div class="user-dropdown-wrapper">
      <div class="user-avatar-sm user-dropdown-btn" id="userDropdownBtn">U</div>
      <div class="user-dropdown-menu" id="userDropdownMenu">
        <a href="#" class="dropdown-item" id="dropdownProfile"><i class="fas fa-user"></i> <span data-i18n="common.profile">Profile</span></a>
        <a href="#" class="dropdown-item" id="dropdownSettings"><i class="fas fa-cog"></i> <span data-i18n="common.settings">Settings</span></a>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" id="dropdownLogout"><i class="fas fa-sign-out-alt"></i> <span data-i18n="nav.logout">Log Out</span></button>
      </div>
    </div>
      </div>
    </header>

    <!-- Tab: Pending (teacher sees requests, student sees awaiting) -->
    <section class="tab-content active" id="tab-pending">
      <div class="card">
        <div class="card-header"><h3 id="pendingTitle" data-i18n="nav.pending">Pending Sessions</h3></div>
        <div class="card-body">
          <div class="sessions-list" id="pendingList"></div>
        </div>
      </div>
    </section>

    <!-- Tab: Upcoming -->
    <section class="tab-content" id="tab-upcoming">
      <div class="card">
        <div class="card-header"><h3 data-i18n="nav.upcoming">Upcoming Sessions</h3></div>
        <div class="card-body">
          <div class="sessions-list" id="upcomingList"></div>
        </div>
      </div>
    </section>

    <!-- Tab: Completed -->
    <section class="tab-content" id="tab-completed">
      <div class="card">
        <div class="card-header"><h3 data-i18n="nav.completed">Completed Sessions</h3></div>
        <div class="card-body">
          <div class="sessions-list" id="completedList"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Add Meet Link Modal (teacher) -->
  <div class="modal-overlay" id="meetLinkModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="sessions.add_meet_link_modal">Add Google Meet Link</h3>
        <button class="modal-close" onclick="document.getElementById('meetLinkModal').classList.remove('active')"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <form id="meetLinkForm">
          <input type="hidden" id="meetSessionId">
          <div class="form-group">
            <label data-i18n="sessions.meet_link_label">Google Meet Link</label>
            <input type="url" id="meetLinkInput" data-i18n-placeholder="sessions.placeholder_meet" placeholder="https://meet.google.com/xxx-xxxx-xxx" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="sessions.share_start_btn">Share Link & Start Session</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Score Modal (teacher completes session with score) -->
  <div class="modal-overlay" id="sessionScoreModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="scores.title">Score Session</h3>
        <button class="modal-close" onclick="closeSessionScoreModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <form id="sessionScoreForm">
          <input type="hidden" id="scoreSessionId">
          <div class="form-group">
            <label data-i18n="scores.portion">Surah / Portion</label>
            <input type="text" id="ssPortion" data-i18n-placeholder="scores.portion_placeholder" placeholder="e.g., Surah Al-Fatiha" required>
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
            <div class="form-group">
              <label data-i18n="scores.tajweed">Tajweed (0-100)</label>
              <input type="number" id="ssTajweed" min="0" max="100" data-i18n-placeholder="sessions.placeholder_score" placeholder="0-100" required>
            </div>
            <div class="form-group">
              <label data-i18n="scores.memorization">Memorization (0-100)</label>
              <input type="number" id="ssMemorization" min="0" max="100" data-i18n-placeholder="sessions.placeholder_score" placeholder="0-100" required>
            </div>
            <div class="form-group">
              <label data-i18n="scores.fluency">Fluency (0-100)</label>
              <input type="number" id="ssFluency" min="0" max="100" data-i18n-placeholder="sessions.placeholder_score" placeholder="0-100" required>
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="scores.comments">Comments</label>
            <textarea id="ssComments" rows="2" data-i18n-placeholder="scores.comments_placeholder" placeholder="Feedback for the student..."></textarea>
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <button type="submit" class="btn btn-primary btn-block" data-i18n="scores.submit">Complete & Submit Score</button>
            <button type="button" class="btn btn-outline btn-block" onclick="completeWithoutScore()" data-i18n="sessions.complete_no_score">Complete Without Score</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Review Modal (student) -->
  <div class="modal-overlay" id="reviewModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="review.title">Leave a Review</h3>
        <button class="modal-close" onclick="document.getElementById('reviewModal').classList.remove('active')"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <form id="reviewForm">
          <input type="hidden" id="reviewSessionId">
          <div class="form-group">
            <label data-i18n="review.rating">Rating</label>
            <div class="star-rating" id="starRating">
              <i class="fas fa-star" data-star="1"></i>
              <i class="fas fa-star" data-star="2"></i>
              <i class="fas fa-star" data-star="3"></i>
              <i class="fas fa-star" data-star="4"></i>
              <i class="fas fa-star" data-star="5"></i>
            </div>
            <input type="hidden" id="reviewRating" value="0">
          </div>
          <div class="form-group">
            <label data-i18n="review.comment">Comment (optional)</label>
            <textarea id="reviewComment" rows="3" data-i18n-placeholder="review.comment_placeholder" placeholder="How was your session?"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="review.submit">Submit Review</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
