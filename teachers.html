<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="nav.browse_teachers">Browse Teachers - Aya Learn</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="dashboard-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="logo"><i class="fas fa-book-quran"></i> <span data-i18n="app.name">Aya Learn</span></a>
      <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <a href="teachers.html" class="nav-item active" data-i18n="nav.browse_teachers"><i class="fas fa-search"></i> Browse Teachers</a>
      <a href="sessions.html" class="nav-item" data-i18n="nav.sessions"><i class="fas fa-calendar"></i> My Sessions</a>
      <a href="student-dashboard.html" class="nav-item" data-i18n="nav.dashboard"><i class="fas fa-home"></i> Dashboard</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">S</div>
        <div class="user-details">
          <span class="user-name"></span>
          <span class="user-role"></span>
        </div>
      </div>
      <a href="#" class="nav-item logout" data-i18n="nav.logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="menu-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      <h1 data-i18n="nav.browse_teachers">Browse Teachers</h1>
      <div class="topbar-actions">
        <div class="notif-wrapper">
          <button class="notif-btn" id="notifBtn"><i class="fas fa-bell"></i><span class="notif-badge" id="notifBadge" style="display:none">0</span></button>
          <div class="notif-dropdown" id="notifDropdown"></div>
        </div>
        <div class="user-dropdown-wrapper">
          <div class="user-avatar-sm user-dropdown-btn" id="userDropdownBtn">U</div>
          <div class="user-dropdown-menu" id="userDropdownMenu">
            <a href="#" class="dropdown-item" id="dropdownProfile"><i class="fas fa-user"></i> <span data-i18n="common.profile">Profile</span></a>
            <a href="#" class="dropdown-item" id="dropdownSettings"><i class="fas fa-cog"></i> <span data-i18n="common.settings">Settings</span></a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item danger" id="dropdownLogout"><i class="fas fa-sign-out-alt"></i> <span data-i18n="nav.logout">Log Out</span></button>
          </div>
        </div>
      </div>
    </header>

    <div style="padding:24px">
      <div class="filter-bar" style="margin-bottom:24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <select id="specFilter" class="filter-select">
          <option value="" data-i18n="filter.all_specs">All Specializations</option>
          <option value="Tajweed" data-i18n="teacher.spec_tajweed">Tajweed</option>
          <option value="Hifz" data-i18n="teacher.spec_hifz">Hifz</option>
          <option value="Qiraat" data-i18n="teacher.spec_qiraat">Qiraat</option>
          <option value="Beginners" data-i18n="teacher.spec_beginners">Beginners</option>
        </select>
        <select id="priceFilter" class="filter-select">
          <option value="" data-i18n="filter.all_prices">Any Price</option>
          <option value="10">$10</option>
          <option value="20">$20</option>
          <option value="50">$50</option>
        </select>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" data-i18n-placeholder="filter.search_teachers" placeholder="Search teachers..." id="teacherSearch">
        </div>
      </div>

      <div class="teachers-grid" id="teachersGrid"></div>
    </div>
  </main>

  <!-- Teacher Profile / Booking Modal -->
  <div class="modal-overlay" id="teacherModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="teacherModalName">Teacher</h3>
        <button class="modal-close" onclick="document.getElementById('teacherModal').classList.remove('active')"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="teacherModalBody"></div>
    </div>
  </div>

  <!-- Booking Form Modal -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="booking.confirm_booking">Book Session</h3>
        <button class="modal-close" onclick="document.getElementById('bookingModal').classList.remove('active')"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <form id="bookingForm">
          <input type="hidden" id="bookingTeacherId">
          <p style="margin-bottom:16px;color:var(--text-light)" data-i18n="sessions.book_with">Booking with: <strong id="bookingTeacherName"></strong></p>
          <p style="margin-bottom:16px;color:var(--text-light)" data-i18n="sessions.price">Price: <strong id="bookingPrice"></strong></p>
          <div class="form-group">
            <label data-i18n="sessions.date_time">Date & Time</label>
            <input type="datetime-local" id="bookingDate" required>
          </div>
          <div class="form-group">
            <label data-i18n="sessions.duration">Duration (minutes)</label>
            <select id="bookingDuration">
              <option value="30" data-i18n="sessions.duration_30">30 minutes</option>
              <option value="60" data-i18n="sessions.duration_60">60 minutes</option>
              <option value="90" data-i18n="sessions.duration_90">90 minutes</option>
            </select>
          </div>
          <div class="form-group">
            <label data-i18n="booking.notes_optional">Notes (optional)</label>
            <textarea id="bookingNotes" rows="3" data-i18n-placeholder="booking.notes_placeholder" placeholder="What would you like to focus on?"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="booking.confirm_booking">Confirm Booking</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
