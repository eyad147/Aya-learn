<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="signup.title">Sign Up - Aya Learn</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo"><i class="fas fa-book-quran"></i> <span data-i18n="app.name">Aya Learn</span></a>
        <h2 data-i18n="signup.title">Create Account</h2>
        <p data-i18n="signup.subtitle">Start your Quran learning journey</p>
      </div>

      <form class="auth-form" id="signupForm">
        <div class="form-group">
          <label for="signupName" data-i18n="signup.name">Full Name</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="signupName" data-i18n-placeholder="signup.name_placeholder" placeholder="Your full name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="signupEmail" data-i18n="login.email">Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="signupEmail" data-i18n-placeholder="login.email_placeholder" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="signupPassword" data-i18n="login.password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="signupPassword" data-i18n-placeholder="signup.create_password" placeholder="Create a password" required>
            <button type="button" class="toggle-password" onclick="togglePassword('signupPassword', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="signupRole" data-i18n="signup.role">I want to join as</label>
          <div class="input-wrapper">
            <i class="fas fa-id-badge"></i>
            <select id="signupRole" required>
              <option value="" disabled selected data-i18n="signup.select_role">Select your role</option>
              <option value="student" data-i18n="signup.role_student">Student</option>
              <option value="teacher" data-i18n="signup.role_teacher">Teacher</option>
            </select>
          </div>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" required> <span data-i18n="signup.agree_terms">I agree to the Terms of Service</span>
        </label>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="signup.submit">Sign Up</button>

        <div class="auth-divider"><span data-i18n="signup.or">or</span></div>

        <button type="button" class="btn btn-google btn-block" onclick="window.location.href='/api/auth/google'">
          <i class="fab fa-google"></i> <span data-i18n="signup.google">Continue with Google</span>
        </button>

        <p class="auth-footer"><span data-i18n="signup.has_account">Already have an account?</span> <a href="login.html" data-i18n="signup.login_link">Log In</a></p>
      </form>
    </div>

    <div class="auth-visual">
      <div class="auth-visual-content">
        <i class="fas fa-book-quran"></i>
        <h3 data-i18n="app.name">Aya Learn</h3>
        <p data-i18n="app.tagline">Your journey in Quran memorization starts here</p>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const googleAuth = params.get('google_auth');
      if (googleAuth) {
        try {
          const data = JSON.parse(atob(googleAuth));
          if (data.token && data.user) {
            saveAuth(data.user, data.token);
            redirectBasedOnRole(data.user.role);
          }
        } catch(e) {
          console.error('Google auth error:', e);
        }
      }
      const err = params.get('error');
      if (err === 'google_auth_failed') {
        alert(t('auth.google_failed'));
      }
    })();
  </script>
</body>
</html>
